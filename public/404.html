<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Theme Aquarium Chennai - Page Not Found</title>
    <script>
      // Single Page App redirect for GitHub Pages & Static Hosts
      // Preserves deep route paths (e.g., /shop, /custom-aquarium-chennai) for SPA router
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Redirect to root with p query param so RouterContext restores clean URL
        var target = '/?p=' + encodeURIComponent(path + search) + hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body style="background:#03080e;color:#10b981;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p style="font-size:14px;letter-spacing:1px;font-family:monospace;">Navigating to Theme Aquarium...</p>
  </body>
</html>
