<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,700;0,800;0,900&amp;family=Cinzel:wght@800;900&amp;display=swap');
      
      .theme-text {
        font-family: 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-weight: 700;
        fill: #27ae60;
        font-size: 110px;
        letter-spacing: -2px;
      }
      
      .aqua-text {
        font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', serif;
        font-weight: 900;
        fill: #0c2340;
        font-size: 80px;
        letter-spacing: 6px;
      }
      
      .leaf-green {
        fill: #27ae60;
      }

      .leaf-light {
        fill: #2ecc71;
      }
    </style>
  </defs>

  <!-- THEME Graphic Component -->
  <g transform="translate(40, 20)">
    
    <!-- Stylized 'T' Plant Sprout Icon -->
    <!-- Left Leaf on T -->
    <path d="M 90,65 C 65,50 35,40 18,52 C 10,58 6,66 6,75 C 18,78 40,78 68,76 C 78,75 86,70 90,65 Z" fill="#27ae60" />
    <path d="M 25,58 C 45,62 65,68 85,67 C 65,60 45,55 25,58 Z" fill="#2ecc71" opacity="0.6"/>

    <!-- Right Leaf on T -->
    <path d="M 85,65 C 105,48 135,38 152,48 C 160,54 163,63 160,72 C 148,77 125,78 98,76 C 90,75 86,70 85,65 Z" fill="#27ae60" />
    <path d="M 145,54 C 125,60 105,67 90,67 C 110,60 130,53 145,54 Z" fill="#2ecc71" opacity="0.6"/>

    <!-- Stem / T Vertical Trunk -->
    <path d="M 82,68 C 83,85 84,115 84,135 C 84,142 82,148 72,150 C 65,151 55,150 50,148 C 48,147 46,149 48,153 C 55,157 70,158 84,158 C 96,158 102,152 102,140 C 102,118 100,85 98,68 Z" fill="#27ae60" />

    <!-- Word "heme" -->
    <text x="135" y="146" class="theme-text">heme</text>
  </g>

  <!-- AQUARIUM Graphic Component -->
  <g transform="translate(30, 185)">
    <!-- Base text "AQUARIUM" -->
    <text x="0" y="65" class="aqua-text">AQUARIUM</text>

    <!-- Leaf inside first 'A' Counter -->
    <g transform="translate(18, 26) scale(0.65)">
      <path d="M 12,38 C 2,24 5,8 20,2 C 28,14 26,30 12,38 Z" fill="#27ae60" />
      <path d="M 12,38 C 15,25 20,12 20,2 C 16,15 13,27 12,38 Z" fill="#2ecc71" />
    </g>
  </g>
</svg>
